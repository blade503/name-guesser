name = "pronostics-bebe-api"
main = "index.ts"
compatibility_date = "2026-08-01"

# ALLOWED_ORIGINS : origines autorisées à appeler l'API (séparées par des virgules).
# Remplacer <user> par ton pseudo GitHub après le premier déploiement de Pages.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://<user>.github.io"

# ADMIN_PASSWORD n'est PAS ici : c'est un secret, poussé via
#   npx wrangler secret put ADMIN_PASSWORD --config worker/wrangler.toml

[[d1_databases]]
binding = "DB"
database_name = "pronostics-bebe"
database_id = "<à remplir après `wrangler d1 create pronostics-bebe`>"

[observability]
enabled = true
